<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'">
  <title>Method Finder — allmeta</title>
  <link rel="stylesheet" href="../hub/styles.css">
  <link rel="icon" type="image/svg+xml" href="../shared/icon.svg">
  <script src="../shared/build-info.js"></script>
  <script src="../shared/autosave.js"></script>
  <style>
    :root {
      --finder-accent: #2563eb;
      --finder-accent-bg: #dbeafe;
      --finder-card: #ffffff;
      --finder-border: #e5e7eb;
      --finder-text: #1f2937;
      --finder-text-muted: #6b7280;
      --finder-shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --finder-card: #1f2937;
        --finder-border: #374151;
        --finder-text: #f9fafb;
        --finder-text-muted: #9ca3af;
        --finder-shadow: 0 6px 16px rgba(0,0,0,0.30);
        --finder-accent-bg: rgba(37,99,235,0.16);
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           background: var(--bg, #f9fafb); color: var(--finder-text); margin: 0; padding: 0; }
    .finder-wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
    .finder-head { margin-bottom: 24px; }
    .finder-head h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.01em; }
    .finder-head p { margin: 0; color: var(--finder-text-muted); font-size: 15px; line-height: 1.55; max-width: 640px; }
    .breadcrumbs { display: flex; gap: 8px; align-items: center; margin: 16px 0 24px;
                   color: var(--finder-text-muted); font-size: 13px; flex-wrap: wrap; }
    .breadcrumbs button { background: none; border: 0; padding: 0; cursor: pointer;
                          color: var(--finder-accent); font: inherit; }
    .breadcrumbs button:hover { text-decoration: underline; }
    .breadcrumb-sep { opacity: 0.5; }
    .card { background: var(--finder-card); border: 1px solid var(--finder-border);
            border-radius: 14px; padding: 24px 26px; margin-bottom: 18px;
            box-shadow: var(--finder-shadow); }
    .card h2 { margin: 0 0 18px; font-size: 19px; }
    .opt-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { width: 100%; text-align: left; background: var(--finder-card);
               border: 1.5px solid var(--finder-border); border-radius: 10px;
               padding: 14px 18px; font: inherit; cursor: pointer;
               transition: border-color 120ms, background 120ms, transform 120ms;
               color: var(--finder-text); display: flex; align-items: center; gap: 12px; }
    .opt-btn:hover { border-color: var(--finder-accent); background: var(--finder-accent-bg);
                     transform: translateX(2px); }
    .opt-btn::before { content: "▸"; color: var(--finder-accent); font-size: 14px; }
    .reco-grid { display: flex; flex-direction: column; gap: 14px; }
    .reco-item { border: 1.5px solid var(--finder-border); border-radius: 10px; padding: 16px 18px;
                 background: var(--finder-accent-bg); }
    .reco-item h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .reco-link { color: var(--finder-accent); text-decoration: none; }
    .reco-link:hover { text-decoration: underline; }
    .reco-why { margin: 0; color: var(--finder-text); font-size: 14px; line-height: 1.5; }
    .start-over { margin-top: 22px; }
    .start-over button { background: var(--finder-card); border: 1.5px solid var(--finder-border);
                         border-radius: 10px; padding: 10px 18px; font: inherit; cursor: pointer;
                         color: var(--finder-text); }
    .start-over button:hover { border-color: var(--finder-accent); color: var(--finder-accent); }
    .back-to-hub { display: inline-block; margin-bottom: 8px; color: var(--finder-text-muted);
                   text-decoration: none; font-size: 13px; }
    .back-to-hub:hover { color: var(--finder-accent); }
    .error { color: #b91c1c; padding: 16px; border: 1px solid #fecaca; border-radius: 10px;
             background: #fef2f2; }
    @media (forced-colors: active) { a, button, [role="button"] { forced-color-adjust: auto; } :focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; } }
  </style>
</head>
<body>
  <div class="finder-wrap">
    <a class="back-to-hub" href="../">← allmeta hub</a>
    <header class="finder-head">
      <h1>Method Finder</h1>
      <p>Answer 2-3 questions about your data; we recommend the right apps with a method-paper rationale. There are 80+ apps in allmeta — this trims that to the 1-3 that fit your question.</p>
    </header>
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Decision path">
      <button data-bc-index="0" type="button">Start</button>
    </nav>
    <div id="root"></div>
  </div>
  <script>
    (function () {
      'use strict';
      var ROOT = document.getElementById('root');
      var BC = document.getElementById('breadcrumbs');
      var TREE = null;
      var path = ['start'];

      function fetchTree() {
        return fetch('./decision-tree.json').then(function (r) {
          if (!r.ok) throw new Error('failed to load decision-tree.json: ' + r.status);
          return r.json();
        });
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function renderBreadcrumbs() {
        BC.innerHTML = '';
        path.forEach(function (nodeId, i) {
          var b = document.createElement('button');
          b.type = 'button';
          b.dataset.bcIndex = String(i);
          b.textContent = i === 0 ? 'Start' : labelForNodeOption(path[i - 1], nodeId);
          b.addEventListener('click', function () {
            path = path.slice(0, i + 1);
            renderCurrent();
            renderBreadcrumbs();
          });
          BC.appendChild(b);
          if (i < path.length - 1) {
            var sep = document.createElement('span');
            sep.className = 'breadcrumb-sep';
            sep.textContent = '›';
            BC.appendChild(sep);
          }
        });
      }
      function labelForNodeOption(parentNodeId, childNodeId) {
        // Recommendation crumbs are stored as '__reco__:<label>' — strip the
        // sentinel and truncate like a normal option label.
        if (childNodeId.indexOf('__reco__:') === 0) {
          var rl = childNodeId.slice(9);
          return rl.length > 36 ? rl.slice(0, 33) + '…' : rl;
        }
        var parent = TREE.nodes[parentNodeId];
        if (!parent || !parent.options) return childNodeId;
        for (var i = 0; i < parent.options.length; i++) {
          if (parent.options[i].next === childNodeId) {
            // Truncate long labels for the crumb trail.
            var lbl = parent.options[i].label;
            return lbl.length > 36 ? lbl.slice(0, 33) + '…' : lbl;
          }
        }
        return childNodeId;
      }
      function renderQuestion(node) {
        var card = document.createElement('div');
        card.className = 'card';
        var h = document.createElement('h2');
        h.textContent = node.question;
        card.appendChild(h);
        var ul = document.createElement('ul');
        ul.className = 'opt-list';
        node.options.forEach(function (opt) {
          var li = document.createElement('li');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'opt-btn';
          btn.textContent = opt.label;
          btn.addEventListener('click', function () {
            if (opt.recommend) {
              path.push('__reco__:' + opt.label);
              renderRecommendations(opt.recommend);
            } else if (opt.next && TREE.nodes[opt.next]) {
              path.push(opt.next);
              renderCurrent();
            }
            renderBreadcrumbs();
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });
        card.appendChild(ul);
        ROOT.innerHTML = '';
        ROOT.appendChild(card);
      }
      function renderRecommendations(recos) {
        var card = document.createElement('div');
        card.className = 'card';
        var h = document.createElement('h2');
        h.textContent = 'Recommended app' + (recos.length > 1 ? 's' : '');
        card.appendChild(h);
        var grid = document.createElement('div');
        grid.className = 'reco-grid';
        recos.forEach(function (r) {
          var item = document.createElement('div');
          item.className = 'reco-item';
          var url = '../' + r.app + '/';
          item.innerHTML =
            '<h3><a class="reco-link" href="' + escapeHtml(url) + '">' + escapeHtml(r.app) + ' →</a></h3>' +
            '<p class="reco-why">' + escapeHtml(r.why) + '</p>';
          grid.appendChild(item);
        });
        card.appendChild(grid);
        var startOver = document.createElement('div');
        startOver.className = 'start-over';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '← Start over';
        btn.addEventListener('click', function () {
          path = ['start'];
          renderCurrent();
          renderBreadcrumbs();
        });
        startOver.appendChild(btn);
        card.appendChild(startOver);
        ROOT.innerHTML = '';
        ROOT.appendChild(card);
      }
      function renderCurrent() {
        var last = path[path.length - 1];
        if (last && last.indexOf('__reco__:') === 0) return;  // already showing recos
        var node = TREE.nodes[last];
        if (!node) {
          ROOT.innerHTML = '<div class="error">Node "' + escapeHtml(last) + '" not found in decision tree.</div>';
          return;
        }
        renderQuestion(node);
      }
      fetchTree().then(function (t) {
        TREE = t;
        renderCurrent();
        renderBreadcrumbs();
      }).catch(function (e) {
        ROOT.innerHTML = '<div class="error">Could not load the decision tree: ' + escapeHtml(e.message) + '</div>';
      });
    })();
  </script>
</body>
</html>
