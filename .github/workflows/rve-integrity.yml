name: rve-integrity

# Runs the rve-meta engine and extras unit tests (Node-backed pytest), the Node
# R-parity/eigen-kernel tests and the page parser/DOM test whenever the engine,
# its WebAssembly eigen backend, the extras module, the page or the tests change.
# The rendered-browser CR2 check (rve-meta-wasm-render.spec.mjs) runs in shared-tests.
on:
  push:
    branches: [main]
    paths:
      - 'shared/rve.js'
      - 'shared/rve-eigen.js'
      - 'shared/numerics/**'
      - 'hub/shared/tests/rve-meta-*'
      - 'shared/rve-extras.js'
      - 'shared/stats-qt.js'
      - 'rve-meta/**'
      - 'tests/test_rve.py'
      - 'tests/test_rve_extras.py'
      - '.github/workflows/rve-integrity.yml'
  pull_request:
    paths:
      - 'shared/rve.js'
      - 'shared/rve-eigen.js'
      - 'shared/numerics/**'
      - 'hub/shared/tests/rve-meta-*'
      - 'shared/rve-extras.js'
      - 'shared/stats-qt.js'
      - 'rve-meta/**'
      - 'tests/test_rve.py'
      - 'tests/test_rve_extras.py'
      - '.github/workflows/rve-integrity.yml'

jobs:
  rve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests/test_rve.py tests/test_rve_extras.py -q
      - run: node --test rve-meta/tests/*.node.cjs
      - run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/deps" linkedom@0.18.12
      - run: node --test hub/shared/tests/rve-meta-parser.node.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
