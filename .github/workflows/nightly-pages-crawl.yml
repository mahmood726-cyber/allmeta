name: nightly-pages-crawl

# Smoke-crawls the LIVE GitHub Pages deployment nightly to catch deploy-only
# regressions the push-triggered local crawl can't see: files missing from the
# build, case-sensitivity breakage (Linux Pages vs the author's Windows), and
# runtime errors on the served bundle. Targets the deployed site directly, so it
# starts NO local web server. Manually runnable via the Actions tab (or
# `gh workflow run nightly-pages-crawl.yml`).

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC nightly
  workflow_dispatch:
    inputs:
      pages_base:
        description: "Base URL to crawl (defaults to the production Pages site)"
        required: false
        default: "https://mahmood726-cyber.github.io/allmeta"

permissions:
  contents: read

jobs:
  pages-crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.pages.config.ts --reporter=line
        env:
          PAGES_BASE: ${{ github.event.inputs.pages_base || 'https://mahmood726-cyber.github.io/allmeta' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-crawl-artifacts
          path: tests/playwright/artifacts/
          if-no-files-found: ignore
          retention-days: 14
