name: shared-tests

# Gates the hub/shared parity + a11y + export suite (R-parity backbone, a11y-sweep,
# chart-export, results-report). These use pre-captured R ground truth, so no R is
# needed in CI. Complements playwright.yml (which only covers tests/playwright).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/shared/tests
    steps:
      - uses: actions/checkout@v4
        with:
          # Baseline replay tests read pinned historical files with git show.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/shared/tests/package-lock.json
      # The Playwright config's webServer launches `python -m http.server`,
      # so make a `python` shim available on the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # The Playwright testMatch excludes Node *.test.mjs; run the exact
      # production extraction-import refusal/control suite as a CI gate.
      - name: Native Node extraction-bus refusal regressions
        run: node --test unit/p04-r8-extraction-import.test.mjs
      # P19 complete-data import and malformed-bus refusal are Node tests, not Playwright *.spec.mjs.
      - name: Native Node component-NMA import refusal and positive controls
        run: node --test unit/p19-r3-bus-completeness.test.mjs unit/p19-r4-bus-import.test.mjs
      # P19 scaling invariance, refusal and pinned stored metafor comparisons.
      # This executes Node *.test.mjs not selected by Playwright *.spec.mjs.
      - name: Native Node component-NMA DL scale regression
        run: node --test unit/p19-scale-defect.test.mjs
      # P17 sensitivity JSON must carry accepted studies for independent replay.
      # Explicit Node gate: Playwright excludes *.test.mjs.
      - name: Native Node correlation-MA sensitivity export replay
        run: node --test unit/p17-sensitivity-export.test.mjs
      # P16 labels containing ' vs ' require a structural key across the
      # serialised live-R handoff. Playwright excludes native *.test.mjs.
      - name: Native Node P16 structural-pair and pinned R-reference regressions
        run: node --test unit/p16-pair-identity.test.mjs unit/p16-pair-identity-parity.test.mjs
      # Exercise the actual displayed-state snapshot, JSON round-trip and R-script
      # generation from a clean checkout (does not claim native R execution).
      - name: Native Node P16 live-R snapshot/export generation
        run: node unit/p16-live-replay.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line,json
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-tests-artifacts
          path: |
            hub/shared/tests/artifacts/
            hub/shared/tests/test-results/
          if-no-files-found: ignore
          retention-days: 14
