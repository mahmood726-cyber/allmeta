name: Cross-design integrity

on:
  pull_request:
    paths:
      - 'shared/cross-design.js'
      - 'cross-design/**'
      - 'tests/test_cross_design.py'
      - 'tests/fixtures/cross-design-alpha0-*'
      - 'hub/shared/tests/cross-design*'
      - '.github/workflows/cross-design-integrity.yml'

jobs:
  alpha-zero-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hub/shared/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_cross_design.py tests/test_real_data_calibration.py -q
      - run: npm ci
        working-directory: hub/shared/tests
      - run: npx playwright install --with-deps chromium
        working-directory: hub/shared/tests
      - run: npx playwright test --config=cross-design.config.mjs --reporter=line
        working-directory: hub/shared/tests
