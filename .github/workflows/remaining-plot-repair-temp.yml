name: Remaining plot repair (temporary branch only)
on:
  push:
    branches: [fix/remaining-plots-20261012]
    paths: [.github/workflows/remaining-plot-repair-temp.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-plots-20261012
      - name: Apply guarded diagnostic and runtime repairs
        run: |
          python scripts/repair-netheat-input.py
          python scripts/repair-netheat-components.py
          python scripts/repair-remaining-plots.py
          python scripts/repair-legacy-and-entrypoints.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/playwright/remaining-runtime-plots.spec.mjs')
          t=p.read_text()
          old="  await expect(f.locator('#var_ref')).toHaveCount(0).catch(()=>{}); // Column detection is automatic in this app.\n  await page.waitForTimeout(1800);await f.locator('#analyze_btn').click();"
          assert t.count(old)==1
          t=t.replace(old,"  await expect(f.locator('#threshold')).toHaveClass(/shiny-bound-input/);\n  await f.locator('#analyze_btn').click();",1)
          p.write_text(t)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Verify remaining plots with actual browser-side R
        run: npx playwright test remaining-plots.spec.mjs remaining-runtime-plots.spec.mjs --workers=2
        working-directory: tests/playwright
      - name: Preserve dedicated remaining-plot report
        if: always()
        working-directory: tests/playwright
        run: |
          test ! -f artifacts/report.json || cp artifacts/report.json artifacts/remaining-report.json
          test ! -d artifacts/html-report || mv artifacts/html-report artifacts/remaining-html-report
      - name: Preserve earlier cross-app rendering regressions
        run: npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs --workers=3 --output=test-results-prior
        working-directory: tests/playwright
      - name: Commit only verified production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPD-Meta-Pro/src/diagnostic-plots.js IPD-Meta-Pro/ipd-meta-pro.html IPD-Meta-Pro/legacy/unreachable-kmeans-block.txt webr-studio/index.html r-shiny/dta-diagnostic/app.json hub/projects.js tests/playwright/remaining-plots.spec.mjs tests/playwright/remaining-runtime-plots.spec.mjs
          git commit -m 'fix: complete IPD diagnostic plots and repair R graphics and runtime entrypoints'
          git push origin HEAD:fix/remaining-plots-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-plot-regressions
          path: |
            tests/playwright/artifacts/
            tests/playwright/test-results/
            tests/playwright/test-results-prior/
          retention-days: 7
