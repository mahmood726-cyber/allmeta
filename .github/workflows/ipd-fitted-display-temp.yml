name: IPD fitted display repair (temporary)
on:
  push:
    branches: [fix/ipd-fitted-plot-display-20261012]
    paths: [.github/workflows/ipd-fitted-display-temp.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipd-fitted-plot-display-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Demonstrate the saved-HKSJ interval regression before patching
        working-directory: tests/playwright
        run: |
          set +e
          npx playwright test ipd-fitted-display.spec.mjs --grep 'saved HKSJ bounds' --workers=2
          code=$?
          cp artifacts/report.json artifacts/fitted-display-before.json
          test "$code" -ne 0
      - name: Apply guarded display-only repair
        run: |
          python scripts/repair-ipd-fitted-display.py
          git diff --check
      - name: Verify eight new display cases
        working-directory: tests/playwright
        run: |
          npx playwright test ipd-fitted-display.spec.mjs --workers=2
          cp artifacts/report.json artifacts/fitted-display-after.json
      - name: Recheck all 170 prior native and R plot workflows
        working-directory: tests/playwright
        run: |
          npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs remaining-plots.spec.mjs remaining-runtime-plots.spec.mjs --workers=3
          cp artifacts/report.json artifacts/prior-170.json
      - name: Commit tested source and remove temporary repair machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPD-Meta-Pro/ipd-meta-pro.html
          git rm scripts/repair-ipd-fitted-display.py .github/workflows/ipd-fitted-display-temp.yml
          git commit -m 'fix(ipd): use fitted plot intervals and replace stale example narratives'
          git push origin HEAD:fix/ipd-fitted-plot-display-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitted-display-regressions
          path: |
            tests/playwright/artifacts/*.json
            tests/playwright/test-results/
          retention-days: 7
