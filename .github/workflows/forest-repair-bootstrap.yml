name: Forest repair materialisation
on:
  push:
    branches: [fix/forest-integrity-20261015]
    paths:
      - '.github/workflows/forest-repair-bootstrap.yml'
      - 'scripts/forest_integrity_patch.py'
      - 'hub/shared/tests/forest-integrity.spec.mjs'
permissions:
  contents: read
concurrency:
  group: forest-repair-materialisation
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forest-integrity-20261015
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hub/shared/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: hub/shared/tests
      - run: npx playwright install --with-deps chromium
        working-directory: hub/shared/tests
      - name: Demonstrate original counterexamples before applying repair
        working-directory: hub/shared/tests
        shell: bash
        run: |
          mkdir -p artifacts/forest-repair
          set +e
          npx playwright test forest-integrity.spec.mjs --grep-invert 'fresh pinned R' --reporter=line > artifacts/forest-repair/before.log 2>&1
          code=$?
          set -e
          tail -100 artifacts/forest-repair/before.log
          test "$code" -ne 0
      - name: Apply source-preserving repair with exact baseline hash
        run: python scripts/forest_integrity_patch.py
      - name: Run affected regressions and fresh pinned R
        working-directory: hub/shared/tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test forest --reporter=line 2>&1 | tee artifacts/forest-repair/after.log
      - name: Materialise tested application and register on this branch only
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/fix/forest-integrity-20261015'
          git diff --check
          git diff -- forest-plot/index.html > hub/shared/tests/artifacts/forest-repair/source.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- forest-plot/index.html docs/APP_REPAIR_REGISTER.json
          git commit -m 'fix(forest): consistent modified-HK reproduction, I2 and safe input/plot state'
          git push origin HEAD:refs/heads/fix/forest-integrity-20261015
          git rev-parse HEAD
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-repair-before-after
          path: |
            hub/shared/tests/artifacts/forest-repair/
            hub/shared/tests/test-results/
          if-no-files-found: warn
