name: Forest integrity
on:
  pull_request:
    paths:
      - 'forest-plot/**'
      - 'shared/ma-core.js'
      - 'shared/webr-runner.js'
      - 'hub/shared/tests/forest*'
      - '.github/workflows/forest-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'forest-plot/**'
      - 'hub/shared/tests/forest*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hub/shared/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: hub/shared/tests
      - run: npx playwright install --with-deps chromium
        working-directory: hub/shared/tests
      - name: Run affected browser and fresh pinned R checks
        run: npx playwright test forest --reporter=line
        working-directory: hub/shared/tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-integrity-evidence
          path: |
            hub/shared/tests/test-results/
            hub/shared/tests/artifacts/
          if-no-files-found: ignore
