name: Secondary plot repair (temporary branch only)
on:
  push:
    branches: [fix/secondary-plot-fidelity-20261012]
    paths: [.github/workflows/secondary-plot-repair-temp.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secondary-plot-fidelity-20261012
      - name: Correct fixture mappings without changing test assertions
        run: python scripts/repair-secondary-plots.py --fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Reproduce three real-UI defects on unchanged production source
        working-directory: tests/playwright
        run: |
          set +e
          npx playwright test secondary-plot-fidelity.spec.mjs --grep 'ranking table|survival zoom|Bayesian trace' --workers=2 --retries=0
          result=$?
          cp artifacts/report.json artifacts/secondary-baseline.json
          echo "Baseline exit code: $result"
          python - <<'PY'
          import json
          d=json.load(open('artifacts/secondary-baseline.json'))
          print('Baseline:',d['stats'])
          assert d['stats']['unexpected']==6 and d['stats']['expected']==0
          PY
      - name: Apply audited adapters and verify source syntax
        run: |
          python scripts/repair-secondary-plots.py
          node --check IPD-Meta-Pro/src/secondary-plot-adapters.js
          git diff --check
      - name: Verify new cases and the existing native-app plot suite
        working-directory: tests/playwright
        run: |
          npx playwright test secondary-plot-fidelity.spec.mjs flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs --workers=3 --retries=0
          cp artifacts/report.json artifacts/secondary-and-native.json
      - name: Verify earlier IPD, export and R-runtime plot repairs
        working-directory: tests/playwright
        run: |
          npx playwright test remaining-plots.spec.mjs remaining-runtime-plots.spec.mjs ipd-plot-fidelity.spec.mjs --workers=2 --retries=0
          cp artifacts/report.json artifacts/secondary-prior-runtime.json
      - name: Commit only the browser-tested source and retained tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPD-Meta-Pro/ipd-meta-pro.html tests/playwright/secondary-plot-fidelity.spec.mjs
          git commit -m 'fix(ipd): use computed rank probabilities and restore secondary plot workflows'
          git push origin HEAD:fix/secondary-plot-fidelity-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-plot-repair-evidence
          path: |
            tests/playwright/artifacts/*.json
            tests/playwright/artifacts/html-report/
            tests/playwright/test-results/**/error-context.md
            tests/playwright/test-results/**/*.png
          retention-days: 7
