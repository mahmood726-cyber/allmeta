name: Secondary plot repair (temporary branch only)
on:
  push:
    branches: [fix/secondary-plot-fidelity-20261012]
    paths: [.github/workflows/secondary-plot-repair-temp.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secondary-plot-fidelity-20261012
      - name: Apply audited adapters, stale-data guards and test fixture corrections
        run: |
          python scripts/repair-secondary-plots.py --fixtures
          python scripts/secondary-plot-final-guards.py
          python scripts/repair-secondary-plots.py
          python - <<'PY'
          from pathlib import Path
          p=Path('IPD-Meta-Pro/ipd-meta-pro.html')
          s=p.read_text()
          blank='\n                                    \n'
          assert s.count(blank)==1
          p.write_text(s.replace(blank,'\n\n'))
          PY
          node --check IPD-Meta-Pro/src/secondary-plot-adapters.js
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Verify unchanged NMA Pro save/reopen path in isolation
        working-directory: tests/playwright
        run: |
          npx playwright test nma-pro-session-plots.spec.mjs --workers=1 --retries=0
          cp artifacts/report.json artifacts/secondary-nma-pro.json
      - name: Verify new cases and the existing native-app plot suite
        working-directory: tests/playwright
        run: |
          npx playwright test secondary-plot-fidelity.spec.mjs flagship-plot-rendering.spec.mjs catalog-svg-plots.spec.mjs --workers=2 --retries=0
          cp artifacts/report.json artifacts/secondary-and-native.json
      - name: Verify earlier IPD, export and R-runtime plot repairs
        working-directory: tests/playwright
        run: |
          npx playwright test remaining-plots.spec.mjs remaining-runtime-plots.spec.mjs ipd-fitted-display.spec.mjs --workers=2 --retries=0
          cp artifacts/report.json artifacts/secondary-prior-runtime.json
      - name: Commit only the browser-tested source and retained tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPD-Meta-Pro/ipd-meta-pro.html IPD-Meta-Pro/src/secondary-plot-adapters.js tests/playwright/secondary-plot-fidelity.spec.mjs
          git commit -m 'fix(ipd): use computed rank probabilities and restore secondary plot workflows'
          git push origin HEAD:fix/secondary-plot-fidelity-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-plot-repair-evidence
          path: |
            tests/playwright/artifacts/*.json
            tests/playwright/artifacts/html-report/
            tests/playwright/test-results/**/error-context.md
            tests/playwright/test-results/**/*.png
          retention-days: 7
