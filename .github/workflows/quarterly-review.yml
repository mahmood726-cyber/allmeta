name: quarterly-review

# Operationalises the quarterly review cycle (REVIEW-CYCLE.md): generates an
# accurate prep snapshot — live health (catalog/parity/lint) + the deferred
# list parsed from ROADMAP.md — and uploads it as an artifact. Non-intrusive:
# it does NOT open issues or push commits; a human runs the actual review.

on:
  schedule:
    - cron: "0 9 1 */3 *"   # 09:00 UTC on the 1st of every 3rd month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate review prep snapshot
        run: python scripts/review_cycle.py --out review-prep-snapshot.md
      - name: Show snapshot in the run log
        run: cat review-prep-snapshot.md
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-review-snapshot
          path: review-prep-snapshot.md
          retention-days: 120
