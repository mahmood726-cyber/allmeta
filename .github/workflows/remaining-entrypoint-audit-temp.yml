name: Remaining entrypoint audit (temporary)
on:
  push:
    branches: [fix/remaining-plots-20261012]
    paths: [.github/workflows/remaining-entrypoint-audit-temp.yml]
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Exercise R app plots and inspect actual external app pages
        working-directory: tests/playwright
        run: |
          npx http-server ../.. -p 8080 -c-1 --silent &
          node audit-remaining-entrypoints.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-entrypoint-audit
          path: tests/playwright/artifacts/remaining-entrypoints/
          retention-days: 7
