name: Heterogeneity repair materialisation
on:
  push:
    branches: [fix/heterogeneity-integrity-20261015]
    paths:
      - '.github/workflows/heterogeneity-repair-bootstrap.yml'
      - 'scripts/heterogeneity_integrity_patch.py'
      - 'hub/shared/tests/heterogeneity-integrity.spec.mjs'
permissions:
  contents: read
concurrency:
  group: heterogeneity-repair-materialisation
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/heterogeneity-integrity-20261015
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hub/shared/tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: hub/shared/tests
      - run: npx playwright install --with-deps chromium
        working-directory: hub/shared/tests
      - name: Record original counterexamples
        working-directory: hub/shared/tests
        shell: bash
        run: |
          mkdir -p artifacts/heterogeneity-repair
          set +e
          npx playwright test heterogeneity-integrity.spec.mjs --grep-invert 'fresh pinned R' --reporter=line > artifacts/heterogeneity-repair/before.log 2>&1
          status=$?
          set -e
          tail -120 artifacts/heterogeneity-repair/before.log
          test "$status" -ne 0
      - name: Apply bounded source repair
        run: python scripts/heterogeneity_integrity_patch.py
      - name: Run affected browser, numerical and CSV gates
        working-directory: hub/shared/tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test heterogeneity csv-upload --reporter=line 2>&1 | tee artifacts/heterogeneity-repair/after.log
      - name: Commit tested files on the repair branch only
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/fix/heterogeneity-integrity-20261015'
          git diff --check
          git diff -- heterogeneity/index.html hub/shared/csv-upload.js > hub/shared/tests/artifacts/heterogeneity-repair/source.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- heterogeneity/index.html hub/shared/csv-upload.js
          git commit -m 'fix(heterogeneity): block invalid imports, expose I2 conventions and restore diagnostic axes'
          git push origin HEAD:refs/heads/fix/heterogeneity-integrity-20261015
          git rev-parse HEAD
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heterogeneity-repair-before-after
          path: |
            hub/shared/tests/artifacts/heterogeneity-repair/
            hub/shared/tests/test-results/
          if-no-files-found: warn
