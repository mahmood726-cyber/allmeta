name: IPD export spacing check (temporary)
on:
  push:
    branches: [fix/ipd-fitted-plot-display-20261012]
    paths: [.github/workflows/ipd-export-spacing-temp.yml]
permissions:
  contents: write
jobs:
  spacing:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipd-fitted-plot-display-20261012
      - name: Fix the visually confirmed axis-label overlap
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('IPD-Meta-Pro/ipd-meta-pro.html')
          raw = p.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == 'd8874b568420cb7314639bbe58e7f19d75cac539'
          t = raw.decode()
          a = t.index('function generateForestPlotSVG(')
          b = t.index('// Fallback: embed canvas', a)
          part = t[a:b]
          old = ' const margin = PlotDefaults.largeLabel();'
          assert part.count(old) == 1
          part = part.replace(old, ' // Reserve separate baselines for tick text and the x-axis label.\n const margin = { ...PlotDefaults.largeLabel(), bottom: 80 };')
          p.write_bytes((t[:a] + part + t[b:]).encode())
          p = Path('tests/playwright/ipd-fitted-display.spec.mjs')
          t = p.read_text()
          old = '      return {w,h,finite:pts.every(p=>p.every(Number.isFinite)),'
          assert t.count(old) == 1
          t = t.replace(old, "      const labelGap=+root.querySelector('.axis-label').getAttribute('y')-Math.max(...[...root.querySelectorAll('text.tick-label')].map(e=>+e.getAttribute('y')));\n      return {w,h,labelGap,finite:pts.every(p=>p.every(Number.isFinite)),")
          old = '    expect(geometry.w).toBeGreaterThanOrEqual(800);'
          assert t.count(old) == 1
          t = t.replace(old, old + '\n    expect(geometry.labelGap).toBeGreaterThanOrEqual(18);')
          p.write_text(t)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Repeat all twelve display and download tests after the spacing-only change
        working-directory: tests/playwright
        run: npx playwright test ipd-fitted-display.spec.mjs --workers=2
      - name: Commit tested layout and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPD-Meta-Pro/ipd-meta-pro.html tests/playwright/ipd-fitted-display.spec.mjs
          git rm .github/workflows/ipd-export-spacing-temp.yml
          git commit -m 'fix(ipd): separate forest SVG tick and axis labels'
          git push origin HEAD:fix/ipd-fitted-plot-display-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-final-export-evidence
          path: |
            tests/playwright/artifacts/report.json
            tests/playwright/test-results/
          retention-days: 7
