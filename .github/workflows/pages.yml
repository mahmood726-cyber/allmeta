name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build _site
        run: |
          mkdir -p _site
          rsync -a --exclude='tests/' --exclude='.github/' --exclude='docs/' \
                   --exclude='scripts/' --exclude='node_modules/' \
                   --exclude='.pages-exclude' --exclude='*.md' \
                   --exclude='*/_archive/' --exclude='*/_archive' \
                   --exclude='*/archive/' --exclude='*/archive' \
                   --exclude='*/backup_*' --exclude='*.backup-*' \
                   --exclude='*/dev/' --exclude='*/dev' \
                   --exclude='STUCK_FAILURES.*' --exclude='sentinel-findings.*' \
                   --exclude='review-findings*.md' --exclude='review-findings*.jsonl' \
                   --exclude='*/Submission/' --exclude='*/e156-submission/' \
                   --exclude='*/__pycache__/' --exclude='*.pyc' \
                   --exclude='.pytest_cache/' --exclude='.serena/' \
                   --include='README.md' \
                   ./ _site/
          touch _site/.nojekyll
      # The copy in git is unstamped because a commit cannot contain its own SHA.
      # Stamp only the deployed copy, so exports name the commit actually served
      # and no commit is needed. Fails the deploy if the stamp is not in the site.
      - name: Stamp the deployed build identity
        run: |
          python3 scripts/regen_build_info.py --sha "$GITHUB_SHA" --out _site/shared/build-info.js
          grep -qF "sha: \"$GITHUB_SHA\"" _site/shared/build-info.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
