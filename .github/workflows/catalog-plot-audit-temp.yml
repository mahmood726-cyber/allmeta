name: Catalogue plot audit (repair branch only)
on:
  push:
    branches: [fix/all-app-plot-rendering-20261011]
    paths:
      - .github/workflows/catalog-plot-audit-temp.yml
      - tests/playwright/audit-catalog-plots.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Exercise every locally hosted catalogue entry at desktop and mobile widths
        working-directory: tests/playwright
        run: |
          npx http-server ../.. -p 8080 -c-1 --silent &
          node audit-catalog-plots.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-plot-audit
          path: tests/playwright/artifacts/catalog-plots/
          retention-days: 7
