name: Catalogue plot audit (repair branch only)
on:
  push:
    branches: [fix/all-app-plot-rendering-20261011]
    paths:
      - .github/workflows/catalog-plot-audit-temp.yml
      - tests/playwright/flagship-plot-rendering.spec.mjs
      - tests/playwright/catalog-svg-plots.spec.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Exercise flagship plots, actual saved sessions and tab navigation
        working-directory: tests/playwright
        run: npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs --workers=3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-plot-audit
          path: |
            tests/playwright/artifacts/
            tests/playwright/test-results/
          retention-days: 7
