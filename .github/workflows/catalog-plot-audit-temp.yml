name: Catalogue plot audit (repair branch only)
on:
  push:
    branches: [fix/all-app-plot-rendering-20261011]
    paths: [.github/workflows/catalog-plot-audit-temp.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-app-plot-rendering-20261011
      - name: Apply exact audited rendering repairs
        run: |
          python scripts/repair-plot-rendering.py
          python scripts/repair-plot-rendering-followup.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/playwright/catalog-svg-plots.spec.mjs')
          t = p.read_text()
          old = "test.use({ viewport: { width, height: 900 }, screenshot: 'only-on-failure' });"
          assert t.count(old) == 1
          t = t.replace(old, 'test.use({ viewport: { width, height: 900 } });')
          t = t.replace("test.describe.configure({ mode: 'parallel' });", "test.use({ screenshot: 'only-on-failure' });\ntest.describe.configure({ mode: 'parallel' });")
          p.write_text(t)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs --list
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Exercise catalogue SVGs, flagship plots, saved sessions and navigation
        working-directory: tests/playwright
        run: npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs --workers=3
      - name: Commit only browser-tested application repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Truthcert1/app.min.js Pairwiseai/TruthCert-PairwisePro-v1.0-bundle.html nma-dose-response-app/app.js nma-dose-response-app/index.html IPD-Meta-Pro/ipd-meta-pro.html tests/playwright/flagship-plot-rendering.spec.mjs tests/playwright/catalog-svg-plots.spec.mjs
          git commit -m 'fix: restore saved pairwise plots, NMA Studio Run and data-derived IPD charts'
          git push origin HEAD:fix/all-app-plot-rendering-20261011
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-app-plot-regressions
          path: |
            tests/playwright/artifacts/
            tests/playwright/test-results/
          retention-days: 7
