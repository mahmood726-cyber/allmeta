name: NMA canvas ownership repair (temporary)
on:
  push:
    branches: [fix/all-app-plot-rendering-20261011]
    paths: [.github/workflows/nma-canvas-ownership-temp.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-app-plot-rendering-20261011
      - name: Apply audited ownership and diagnostic adapter repair
        run: |
          python scripts/repair-nma-canvas-ownership.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
        working-directory: tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/playwright
      - name: Verify all 148 rendering and data-preservation checks
        working-directory: tests/playwright
        run: npx playwright test flagship-plot-rendering.spec.mjs nma-pro-session-plots.spec.mjs catalog-svg-plots.spec.mjs --workers=3
      - name: Commit only the browser-tested source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nma-dose-response-app/app.js nma-dose-response-app/index.html tests/playwright/flagship-plot-rendering.spec.mjs
          git commit -m 'fix(nma-studio): remove demo canvas conflicts and render actual fitted diagnostics'
          git push origin HEAD:fix/all-app-plot-rendering-20261011
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-app-plot-ownership-regressions
          path: |
            tests/playwright/artifacts/
            tests/playwright/test-results/
          retention-days: 7
