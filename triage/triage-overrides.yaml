    reason: "stub_count=1 false positive: index.html line 593 uses 'placeholder:' as a JS object property key (LocalLLM panel config), not a UI stub or unimplemented marker. App is functionally complete with 3 tests and R-parity coverage (Cycle 2.2)."
  nma-pro-v2:
    tier: 1
    reason: "stub_count=5 false positives: (1) RETROFIT_AUDIT.md mentions 'pandas stub' and 'stub_count' in documentation text (not code stubs); (2) nma-pro-v8.0.html line 13045 uses 'placeholder' in a JS comment ('Update placeholder labels when distribution changes'). App is a 14,332-line functionally complete NMA platform with 6/7 audit dimensions present-good, 2 tests, and R-parity coverage (Cycle 2.2)."
