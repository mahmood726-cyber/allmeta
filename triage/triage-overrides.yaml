apps:
  prisma-flow:
    kind: non-numerical
    reason: "Pure UI tool — generates PRISMA flow diagrams; has no numerical engine to validate against R."
  effect-size-converter:
    tier: 1
    reason: "Cycle 2.3: stub_count=0 after placeholder detector removed from _STUB_PATTERNS. auto_tier=3 because no README.md at top-level (app has 3 tests + R-parity; confirmed functionally complete, Cycle 2.2)."
  nma-pro-v2:
    tier: 1
    reason: "Cycle 2.3: stub_count=0 after placeholder detector removed. auto_tier=4 because total_size_kb=3.32 < 10.0 threshold (nma-pro-v8.0.html lives in a subdir, not top-level; index.html is a thin redirect). App is a 14,332-line functionally complete NMA platform with 6/7 audit dimensions present-good, 3 tests, R-parity coverage (Cycle 2.2)."
