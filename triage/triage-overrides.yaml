      No interactive primary mount; MISSING-MOUNT from runtime audit is a false-positive
      for this page type.
  effect-size-converter:
    reason: 'Cycle 2.3: stub_count=0 after placeholder detector removed from _STUB_PATTERNS.
      auto_tier=3 because no README.md at top-level (app has 3 tests + R-parity; confirmed
      functionally complete, Cycle 2.2).'
