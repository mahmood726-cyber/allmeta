  prisma-flow:
    kind: non-numerical
    reason: Pure UI tool — generates PRISMA flow diagrams; has no numerical engine
      to validate against R.
  rob-traffic-light:
    kind: non-numerical
    reason: Visual Risk-of-Bias traffic-light renderer. No numerical pooling engine
      to validate against R. Hub category is generic Evidence Synthesis; explicitly
      non-numerical.
