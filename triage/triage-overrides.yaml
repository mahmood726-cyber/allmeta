    reason: Redirect stub at index.html points to living-meta-complete.html (the real
      app, per projects.js path). Atlas measures size of index.html which is intentionally
      minimal.
  local-ai:
    kind: informational
    reason: 'Cycle 4.1: Static info page for setting up a local LLM via Ollama; no
      interactive landmark expected. MISSING-MOUNT from runtime audit is a false-positive
      for this page type.'
  local-install:
    kind: informational
    reason: 'Cycle 4.1: Static info page with one-command R install steps; no interactive
      landmark expected. MISSING-MOUNT from runtime audit is a false-positive for
      this page type.'
  nma-pro-v2:
    reason: 'Cycle 2.3: stub_count=0 after placeholder detector removed. auto_tier=4
      because total_size_kb=3.32 < 10.0 threshold (nma-pro-v8.0.html lives in a subdir,
      not top-level; index.html is a thin redirect). App is a 14,332-line functionally
      complete NMA platform with 6/7 audit dimensions present-good, 3 tests, R-parity
      coverage (Cycle 2.2).'
