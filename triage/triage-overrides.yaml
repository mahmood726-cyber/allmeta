apps:
  # --- Cycle 7.2 overrides: R-parity exemptions for 31 apps ---
  Pairwiseai:
    kind: informational
    reason: Pairwiseai/index.html is a launcher page linking to e156-submission assets
      (the full Pairwise Pro app). Atlas measures the launcher, which is intentionally
      minimal; no interactive numerical mount on this page.
  HTA:
    kind: non-numerical
    reason: Health-economic decision-tree / Markov / DSA framework — comparable R packages
      (heemod, hesim) take >5min per run; engine validated internally via Playwright
      sanity checks.
  bayesian-ma:
    kind: non-numerical
    reason: Bayesian MA app — canonical R refs (bayesmeta, bnma) take >60s on the
      smallest fixture; engine is validated internally via Stan/JAGS-equivalent samplers.
  bayesian-mcmc:
    kind: non-numerical
