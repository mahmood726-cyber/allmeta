<?xml version="1.0" encoding="UTF-8"?>
<!--
  allmeta PWA icon. Square 512x512 (designed at native res; renders crisp
  at any scale because it's vector). Visual: a forest-plot diamond + CI
  whiskers on the brand panel colour. No bitmap deps; safe for offline
  install banners on all desktop + mobile browsers that support
  image/svg+xml in `<link rel="manifest">` icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="allmeta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fa6"/>
      <stop offset="1" stop-color="#2c5e8a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Forest plot motif: 4 horizontal CI whiskers + diamond pooled effect -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.92">
    <line x1="120" y1="160" x2="300" y2="160"/>
    <line x1="150" y1="220" x2="330" y2="220"/>
    <line x1="100" y1="280" x2="260" y2="280"/>
    <line x1="130" y1="340" x2="290" y2="340"/>
  </g>
  <g fill="#fff">
    <circle cx="210" cy="160" r="14"/>
    <circle cx="240" cy="220" r="11"/>
    <circle cx="180" cy="280" r="13"/>
    <circle cx="210" cy="340" r="12"/>
  </g>

  <!-- Pooled diamond at bottom -->
  <polygon points="120,420 256,395 392,420 256,445" fill="#e6a919" stroke="#fff" stroke-width="6"/>

  <!-- Centre line -->
  <line x1="256" y1="120" x2="256" y2="460" stroke="#fff" stroke-width="3" stroke-dasharray="6 6" opacity="0.65"/>

  <!-- Wordmark -->
  <text x="256" y="92" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="60" font-weight="700" fill="#fff" letter-spacing="-2">
    allmeta
  </text>
</svg>
