[pytest]
# Enable importlib mode so tests with the same filename in different folders
# (e.g. test_csv_upload.py in forest-plot/, funnel-plot/, meta-regression/)
# don't collide during multi-directory pytest runs.
addopts = -ra --strict-markers --import-mode=importlib
# Collect ONLY the `test_*.py` prefix convention used by every real unit suite.
# App roots also carry standalone, browser-driven Selenium runner scripts named
# with the `*_test.py` suffix (dosehtml/selenium_full_test.py,
# nma-dose-response-app/*_test.py, Pairwiseai/selenium_test.py). Those need a
# live browser, reassign sys.stdout at import time, and corrupt pytest's capture
# machinery ("I/O operation on closed file" at session teardown). Matching only
# the prefix excludes every such script in one rule. Run them by hand if needed.
python_files = test_*.py
# Never recurse into archived release snapshots, vendored libs, or caches.
# dosehtml/archive/release-snapshots/ holds 18 duplicate-named legacy Selenium
# scripts whose collection corrupts pytest's capture (I/O-on-closed-file at
# teardown) — they are frozen release artifacts, not part of the offline suite.
norecursedirs = archive node_modules shared/vendor .git .pytest_cache __pycache__ dev
